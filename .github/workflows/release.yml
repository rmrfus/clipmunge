name: Release

on:
  push:
    tags:
      - 'v*'

# Grant write access only to the release job.
permissions:
  contents: read

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch annotated tags for --notes-from-tag.
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Verify the tag; no prebuilt binary is published.
      - name: Verify the tag builds
        run: nix build

      # Use the annotated tag message as release notes.
      - name: Publish
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          # --notes-from-tag requires local repository context, without --repo.
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
