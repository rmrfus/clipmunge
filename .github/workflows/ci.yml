name: CI

on:
  push:
    branches: [main]
  pull_request:
  # An advisory published after the last commit is invisible until the next
  # one. For a daemon that sits on a machine for months, that is the normal
  # case rather than the edge case.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  check:
    # Everything runs through the flake devshell: mlua compiles Lua 5.4 from C
    # source, so "pure-Rust crate, use rustup" does not apply, and CI then
    # builds the way `nix run github:rmrfus/clipmunge` does.
    name: fmt · clippy · test · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Format
        run: nix develop --command cargo fmt --all --check

      - name: Clippy
        run: nix develop --command cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: nix develop --command cargo test --locked

      - name: Man pages
        run: |
          nix develop --command groff -man -Tutf8 -ww -z man/man1/clipmunge.1
          nix develop --command groff -man -Tutf8 -ww -z man/man5/clipmunge.5

      - name: Advisories
        run: nix develop --command cargo deny check advisories

      # A dependency nobody calls is not a crash; it keeps turning up in the
      # advisory scan above and can hold rust-version above what we need.
      - name: Unused dependencies
        run: nix develop --command cargo machete

      # aarch64-linux is in the flake's `systems`, so it is a promise. mlua
      # builds Lua from C and `c_char` differs in signedness between the two
      # architectures, which makes a host-only build no evidence at all.
      # `nix flake check` builds checks.* but only evaluates packages.*, so the
      # cross build has to hang off `checks` to be verified rather than parsed.
      - name: Cross-compile check
        run: nix flake check

      # Not just a local convenience: without this the flake rots quietly and
      # the breakage lands on whoever first tries `nix run github:...`. It also
      # runs the suite a second time under buildRustPackage's doCheck, in a
      # sandbox with no network and no $HOME.
      - name: Package
        run: nix build

  msrv:
    # rust-version is otherwise a claim nothing checks: nix gives whatever
    # nixpkgs pins (1.95 today), so the declared floor stays green locally
    # whatever it says. The first run of this job caught exactly that - the
    # manifest claimed 1.85 while mlua-sys wants 1.88.
    name: rust-version floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Check, not build: this proves the floor compiles, and the release
      # artefact comes from the flake job above.
      - name: Check on the declared floor
        run: cargo check --all-targets --locked
