# Actions are pinned to commit SHAs (a tag is mutable - see the
# tj-actions/changed-files compromise, CVE-2025-30066, where every tag was
# repointed at a commit that dumped CI secrets). A SHA that nothing bumps
# rots instead, so the bumping is mechanical rather than a rule in a document:
# dependabot rewrites the SHA and the trailing version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Not a version to keep current. The MSRV job pins this to the declared
      # floor deliberately; bumped to stable it stays green while testing a
      # floor the crate never claimed, which is silent decay of the one thing
      # that job exists to catch. Its versions are branches, not tags, so the
      # pin has to be re-resolved by hand when rust-version moves.
      - dependency-name: dtolnay/rust-toolchain

  # Cargo.lock only. The manifest uses caret ranges, so a patch release needs
  # no edit here; what needs watching is the pinned graph the flake builds.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      versioning-strategy: lockfile-only
