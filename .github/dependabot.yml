# Nothing is excluded here on purpose. The MSRV job's toolchain used to need
# an ignore, because pinning the `1.88` branch put the version in the ref where
# an update would move it; it now pins `v1` and passes `toolchain: "1.88"` as
# an input, which no action update touches. An ignore rule would state a reason
# that is no longer true.
#
# Actions are pinned to commit SHAs (a tag is mutable - see the
# tj-actions/changed-files compromise, CVE-2025-30066, where every tag was
# repointed at a commit that dumped CI secrets). A SHA that nothing bumps
# rots instead, so the bumping is mechanical rather than a rule in a document:
# dependabot rewrites the SHA and the trailing version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Cargo.lock only. The manifest uses caret ranges, so a patch release needs
  # no edit here; what needs watching is the pinned graph the flake builds.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      versioning-strategy: lockfile-only
