[package]
name = "clipmunge"
version = "0.3.0"
edition = "2024"
# Required by mlua-sys and our let-chains.
rust-version = "1.88"
description = "Rule-driven Wayland clipboard rewriter that can put different content in different MIME types"
license = "MIT"
repository = "https://github.com/rmrfus/clipmunge"
homepage = "https://github.com/rmrfus/clipmunge"
readme = "README.md"
keywords = ["wayland", "clipboard", "sway", "lua", "wlroots"]
categories = ["command-line-utilities"]
exclude = [".github/"]

[dependencies]
anyhow = "1"
# Disabling color saved only 320 bytes: env_logger also uses anstream.
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
# Reap notification children via SIGCHLD.
libc = "0.2"
rustix = { version = "1", features = ["pipe", "event", "fs", "std"] }
# Keep Unicode Perl classes and case folding; omit script classes to reduce size.
regex = { version = "1", default-features = false, features = [
    "std",
    "perf",
    "unicode-perl",
    "unicode-case",
] }
wayland-client = "0.31"
# ext-data-control-v1 lives in staging.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
mlua = { version = "0.12", features = ["lua54", "vendored"] }

# Restriction lints need explicit opt-in. CI promotes warnings to errors;
# clippy.toml permits unwrap, expect and panic in tests.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Disallow direct process exits and stdout prints; require documented unsafe blocks.
exit = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

[profile.release]
lto = true
strip = true
# Measured saving: 191 KB (3211 vs 3402 KB). Chosen for size;
# build-time/runtime effects were not measured. See DESIGN.md.
codegen-units = 1
